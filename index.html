<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מלונות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>הזמנות מלונות · הטיול</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#111827;--ink-2:#374151;--muted:#6b7280;--line:#e6e9ee;--line-soft:#eef1f4;--fill:#f3f5f8;
  --brand:#0f766e;--brand-ink:#0b5e58;--brand-soft:#e3f5f2;
  --ok:#166534;--ok-soft:#e6f5ec;--warn:#92400e;--warn-soft:#fdf2e0;--bad:#991b1b;--bad-soft:#fdeceb;--info:#1e40af;--info-soft:#e8effc;
  --radius:16px;--r-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand)}
b,strong{font-weight:700}
.app{max-width:640px;margin:0 auto;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{background:linear-gradient(180deg,#107a71,#0f6b64);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 20px 20px;box-shadow:0 4px 16px rgba(15,118,110,.18)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.1px}
.icon-btn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-size:18px}
.icon-btn:active{background:rgba(255,255,255,.24)}
.hero{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-variant-numeric:tabular-nums}
.hero b{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.8px}
.hero span{font-size:14px;font-weight:500;color:rgba(255,255,255,.82)}
.hero #sTarget{font-weight:700;color:#fff}
.bar{height:5px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;width:0;height:100%;background:#a7f3d0;border-radius:99px;transition:width .4s}
.bar i.over{background:#fca5a5}
/* hotels block: two quiet stat lines under a hairline */
.stats{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:3px}
.stat-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:rgba(255,255,255,.74);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.stat-row b{font-size:14px;font-weight:700;color:#fff}
.stat-row .sep{color:rgba(255,255,255,.32)}
/* grand total: one soft card, paid line docks under it as a footer strip */
.money-rows{margin-top:6px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:12px;font-size:13px;color:rgba(255,255,255,.78)}
.mrow b{color:#fff}
.mrow > b{font-size:15px;font-weight:700;text-align:left}
.mrow.main{color:rgba(255,255,255,.95)}
.mrow.main > b{font-size:19px;font-weight:800}
.mrow .mn{font-size:12.5px;min-width:92px;text-align:left}
.grand{margin-top:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 12px;font-variant-numeric:tabular-nums}
.grand:has(+ .paid-line:not([hidden])){border-radius:14px 14px 0 0}
.grand .g-label{grid-column:1;grid-row:1;font-size:13px;font-weight:600;opacity:.95}
.grand b{grid-column:2;grid-row:1/3;text-align:left;font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.1;white-space:nowrap}
.grand .g-sub{grid-column:1;grid-row:2;white-space:normal;line-height:1.35;font-size:11.5px;opacity:.74;margin-top:2px}
.paid-line{margin-top:2px;padding:7px 14px;border-radius:0 0 14px 14px;background:rgba(255,255,255,.09);font-size:12.5px;color:rgba(255,255,255,.8);display:flex;gap:4px 8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.paid-line b{font-weight:700;color:#fff}
.paid-line .sep{color:rgba(255,255,255,.32)}

/* filters */
.tools{padding:12px 16px 0}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:48px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;min-width:0;min-height:46px;border:0;outline:0;background:none;font-size:16px;color:var(--ink)}
.search input::placeholder{color:#9ca3af}
.search .clear{flex:0 0 44px;width:44px;height:44px;margin-inline-end:-8px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chips::after{content:"";flex:0 0 8px}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;scroll-snap-align:end}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.filter{font-weight:600}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.chip .x{font-size:11px;opacity:.7}
.chip .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.chip.on .cnt{background:#fff;color:var(--brand)}
.count-line{font-size:12.5px;color:var(--muted);padding:0 4px 2px;font-variant-numeric:tabular-nums}
#viewList.is-empty .tools,#viewList.is-empty .chips{display:none}

/* filter sheet */
.fgroup{margin-top:20px}
.fgroup-t{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.1px}
.chipgrid{display:flex;flex-wrap:wrap;gap:8px}
.chipgrid .chip{background:var(--fill);border-color:transparent;scroll-snap-align:none}
.chipgrid .chip.on{background:var(--brand)}
.sheet-foot{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:20px;margin-bottom:calc(-24px - env(safe-area-inset-bottom));padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,0),var(--card) 12px)}

/* list */
.list{padding:8px 16px 0;display:flex;flex-direction:column;gap:12px}
.gap{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--muted);padding:0 4px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed #d5dae1}
.gap.warn{color:var(--warn)}.gap.bad{color:var(--bad)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;border:1px solid transparent;position:relative;overflow:hidden}
.card:active{transform:scale(.995)}
.card::before{content:none}
/* linked bookings: calm background tint only, no colored border, no side bar */
.card.grouped{background:color-mix(in srgb,var(--gc) 22%,#fff);border-color:transparent}
.card.excluded{opacity:.82}
.alt-group{background:color-mix(in srgb,var(--gc) 20%,#fff);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
.alt-group .card{box-shadow:none;border:1px solid var(--line-soft)}
.alt-group .card.excluded{opacity:.9}
.ag-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:2px 4px 8px}
.ag-status{flex:0 0 auto;font-size:12px;border-radius:99px;padding:2px 10px}
.ag-status.ok{background:var(--ok-soft);color:var(--ok)}.ag-status.pending{background:var(--warn-soft);color:var(--warn)}
.ag-tabs{display:flex;gap:8px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.ag-tabs::-webkit-scrollbar{display:none}
.ag-tab{flex:1 1 0;min-width:96px;min-height:56px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.25;color:var(--ink-2)}
.ag-tab .ag-name{font-size:12.5px;font-weight:600}
.ag-tab b{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.ag-tab .ag-sub{font-size:11px;color:var(--muted)}
.ag-tab.counted .ag-sub{color:var(--ok);font-weight:600}
.ag-tab.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.ag-choose{width:100%;margin-top:10px}
.ag-status.bad{background:var(--bad-soft);color:var(--bad)}
.ag-tab .ag-sub.bad{color:var(--bad);font-weight:700}
.ag-cancel{margin-top:10px;background:var(--bad-soft);border-radius:12px;padding:10px}
.ag-cancel-txt{font-size:13px;font-weight:700;color:var(--bad);margin-bottom:8px;text-align:center}
.ag-cancel-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.danger-solid{background:var(--bad);color:#fff}
.ag-note.bad{color:var(--bad);font-weight:600}
.alt-badge.bad{background:var(--bad-soft);color:var(--bad)}
.pill.tocancel{background:#fee2e2;color:#991b1b;font-weight:700;flex:0 0 auto}
.cancel-banner{background:var(--bad-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;color:var(--bad);font-size:13px}
.cancel-banner b{font-size:14px}
.cancel-banner .btn{margin-top:2px}
.ag-note{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 4px 0}
.card.excluded .c-title,.card.excluded .price{color:var(--ink-2)}
.alt-badge,.group-badge{display:inline-flex;align-items:center;min-height:24px;font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 8px;margin-bottom:8px;line-height:1.3;max-width:100%}
.alt-badge.on{background:var(--ok-soft);color:var(--ok)}.alt-badge.off{background:var(--warn-soft);color:var(--warn)}
.group-badge{color:var(--ink-2);background:color-mix(in srgb,var(--gc) 85%,#fff)}
.group-badge+.alt-badge{margin-inline-start:6px}
.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.c-head>div:first-child{min-width:0;flex:1}
.c-title{font-weight:700;font-size:16.5px;line-height:1.3;letter-spacing:-.1px}
.c-sub{color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.badge{display:inline-flex;align-items:center;height:24px;gap:4px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--pc,#94a3b8) 11%,#fff);color:color-mix(in srgb,var(--pc,#94a3b8) 82%,#000);border:1px solid color-mix(in srgb,var(--pc,#94a3b8) 22%,#fff);flex:0 0 auto;margin-top:1px}
.c-dates{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.c-dates .n{display:inline-flex;align-items:center;height:24px;background:var(--brand-soft);color:var(--brand-ink);padding:0 8px;border-radius:8px;font-size:12px;font-weight:600}
.c-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 12px;margin-top:12px;flex-wrap:wrap}
.pb{min-width:0;font-variant-numeric:tabular-nums}
.pb-lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.pb-big{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.pb-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.pb.has-extra{flex:1 1 100%;background:var(--fill);border-radius:12px;padding:8px 10px}
.pb-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);line-height:1.5}
.pb-row .v{font-weight:700;white-space:nowrap}
.pb-row .v small{font-weight:500;color:var(--muted);font-size:11.5px}
.pb-row.extra{color:var(--warn)}.pb-row.extra .v{color:var(--warn)}
.pb-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-size:14px;color:var(--ink);font-weight:700}
.pb-row.total .v{font-size:18px;font-weight:800;letter-spacing:-.3px}
.card.excluded .pb-big,.card.excluded .pb-row.total{color:var(--ink-2)}
.price{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.2;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;height:26px;font-size:12px;padding:0 8px;border-radius:8px;background:var(--fill);color:#4b5563;font-weight:600;white-space:nowrap;line-height:1}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.info{background:var(--info-soft);color:var(--info)}
.empty{text-align:center;color:var(--muted);padding:48px 24px 24px;font-size:15px;line-height:1.5}
.empty b{display:block;font-size:40px;margin-bottom:12px;line-height:1}
.empty .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;margin-top:16px}
.empty .hint{margin-top:12px}

/* fab */
.fab{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 20px rgba(15,118,110,.32);z-index:15}
[dir=rtl] .fab{inset-inline-start:auto;right:50%;transform:translateX(50%)}
.fab:active{transform:translateX(50%) scale(.95)}
.fab[hidden]{display:none}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;max-height:92dvh;overflow:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet-top{position:relative;height:44px;display:flex;justify-content:center;align-items:flex-start;padding-top:8px}
.handle{width:36px;height:4px;border-radius:99px;background:#d8dce3}
.sheet-close{position:absolute;top:0;inset-inline-end:-8px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);font-size:17px}
.sheet-close:active{background:var(--fill)}
.sheet h2{font-size:19px;margin:0 0 12px;font-weight:700;line-height:1.3;letter-spacing:-.1px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-head h2{margin:0;flex:1;min-width:0}
.sheet-head .badge{margin-top:3px}
.sheet .c-sub{margin-top:3px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv div{background:#f7f9fb;border-radius:12px;padding:9px 12px;min-width:0}
.kv div.full{grid-column:1/-1}
.kv label{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.kv span{font-weight:600;font-size:14.5px;word-break:break-word;font-variant-numeric:tabular-nums}
.kv span.tag{display:inline-flex;height:auto;min-height:26px;padding:4px 8px;font-size:12.5px;line-height:1.3;white-space:normal;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.actions+.actions{margin-top:8px}
/* destructive actions: grouped under a hairline, quiet text-style buttons */
.actions.danger-zone{margin-top:14px;padding-top:10px;border-top:1px solid var(--line-soft)}
.btn{min-height:48px;padding:12px;border-radius:12px;font-weight:600;font-size:15px;text-align:center;background:var(--fill);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;line-height:1.25}
.btn.primary{background:var(--brand);color:#fff;font-weight:700}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.quiet{background:none;color:var(--bad);font-size:14px;padding:10px 8px;border:1px solid transparent}
.btn.quiet:active{background:var(--bad-soft)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.full{grid-column:1/-1}
.btn:disabled{opacity:.5}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .f{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;margin-top:12px;min-width:0}
form .f.full{grid-column:1/-1}
/* form section labels */
.fsec{margin-top:24px;padding-bottom:6px;border-bottom:1px solid var(--line-soft);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.2px}
h2+.fsec,.replace-note+.fsec{margin-top:6px}
.fsec+.f,.fsec+.row>.f,.fsec+.toggle{margin-top:10px}
.toggle+.toggle{margin-top:8px}
form label{font-size:12.5px;color:var(--ink-2);font-weight:600}
form input,form select,form textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px;width:100%;outline:0;min-height:46px}
form input::placeholder,form textarea::placeholder{color:#9ca3af}
form input:focus,form select:focus,form textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
form textarea{min-height:72px;resize:vertical}
.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;min-height:48px}
.toggle b{font-weight:600;font-size:15px}
.switch{width:48px;height:28px;border-radius:99px;background:#d1d5db;position:relative;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(-20px)}
.replace-note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px;font-weight:500;line-height:1.45}

/* budget + expenses */
.bcard{margin:12px 16px 0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.b-total b{display:block;font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.b-total span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.bar.light{background:var(--line-soft);margin-top:12px}.bar.light i{background:var(--brand)}.bar.light i.over{background:var(--bad)}
.b-rows{margin-top:16px;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.b-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px;align-items:center;color:var(--ink-2)}
.b-row b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;font-size:14px}
.b-row i,.b-row .b-track{grid-column:1/-1;display:block;height:4px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.b-row .b-track i{grid-column:auto;background:var(--brand);opacity:.6;height:100%}
.b-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 0}
.b-head h3{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.card.exp{padding-inline-start:14px}
.card.exp::before{display:none}
.card.exp .c-head{align-items:flex-start}
.card.exp .price{flex:0 0 auto;max-width:46%;text-align:left;font-size:18px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.card.exp .price small{margin-top:0}
.card.exp .price .tag{height:24px;font-size:11.5px;padding:0 7px}
.hist{padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.h-item{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.h-item .h-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.h-item time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.h-item .h-note{color:var(--muted);font-size:12.5px;margin-top:4px;word-break:break-word}
.h-actions{display:flex;gap:16px;margin-top:2px}
.restore{min-height:44px;display:inline-flex;align-items:center;font-size:13px;color:var(--brand);font-weight:600}
.restore.danger{color:var(--bad)}

/* header alerts + tabs */
.alert-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;min-width:0}
.pill{flex:0 0 auto;position:relative;min-height:34px;line-height:34px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-weight:500;white-space:nowrap}
button.pill::before{content:"";position:absolute;inset:-5px}
.alert-line.off .pill.status{opacity:.8}
.pill.next{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-weight:600}
.pill.next .h{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;direction:ltr;unicode-bidi:isolate;text-align:right}
.pill.due-bad{color:#fecaca}.pill.due-warn{color:#fde68a}.pill.due-ok{color:#a7f3d0}
.tabbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top))}
.tabs{display:flex;gap:4px;background:#e6e9ee;border-radius:12px;padding:3px}
.tabs button{flex:1;min-height:44px;padding:0 2px;border-radius:10px;color:#4b5563;font-weight:500;font-size:14px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 6px rgba(16,24,40,.08)}

.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:var(--bad)}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#5eead4,transparent);background-size:200% 100%;animation:ld 1s linear infinite;z-index:70;display:none}
.loading.on{display:block}
@keyframes ld{to{background-position:-200% 0}}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.textbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:4px;color:var(--brand);font-weight:600;font-size:14px}
.setup{margin:24px 16px;background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.setup h3{margin:0 0 8px;font-size:16px}
/* ===== הדפסה / PDF ===== */
#printView{display:none}
@media print{
  body{background:#fff!important}
  .app,.fab,.sheet,.sheet-bg,.toast,.loading,.tabbar{display:none!important}
  #printView{display:block!important;font-family:Heebo,Arial,sans-serif;color:#111;padding:0;font-size:12px;direction:rtl}
  @page{size:A4 landscape;margin:12mm 10mm}
}
#printView .p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0f766e;padding-bottom:8px;margin-bottom:12px}
#printView h1{margin:0;font-size:22px;color:#0f766e}
#printView .p-sub{color:#555;font-size:12px}
#printView .p-sum{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px}
#printView .p-sum b{font-size:15px;display:block}
#printView table{width:100%;max-width:100%;border-collapse:collapse;font-size:10.5px;page-break-inside:auto;table-layout:auto}
#printView th{background:#e6f4f1;color:#0f5132;text-align:right;padding:6px 5px;border-bottom:1px solid #b5d9cf;font-weight:700;white-space:normal;line-height:1.2;vertical-align:bottom}
#printView td{padding:6px 5px;border-bottom:1px solid #e5e7eb;vertical-align:top}
#printView td.hotel{min-width:90px;font-weight:700}
#printView td.nowrap{white-space:nowrap}
#printView td.key{background:#f0fdf9;white-space:normal;min-width:64px}
#printView td.key b{color:#0f5132;font-size:12px;display:block;white-space:normal;word-break:normal;overflow-wrap:anywhere}
#printView td.key.warn b{color:#b45309}
#printView th.k{background:#cdeee4}
#printView tr{page-break-inside:avoid}
#printView tr.dup td{background:#fff7ed}
#printView td.num{white-space:normal;font-variant-numeric:tabular-nums}
#printView td.nowrap{white-space:nowrap}
#printView .note{color:#555;font-size:10.5px}
#printView .p-gaps{margin-top:10px;font-size:11.5px;color:#92400e}
#printView .p-foot{margin-top:14px;font-size:10.5px;color:#777;border-top:1px solid #e5e7eb;padding-top:6px}
</style>

<body>
<div class="loading" id="loading"></div>
<div class="app">
  <header class="top">
    <div class="top-row">
      <h1>🏨 הזמנות מלונות</h1>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" id="btnPrint" type="button" title="הדפסה / PDF" aria-label="הדפסה">🖨</button>
        <button class="icon-btn" id="btnSettings" type="button" title="הגדרות" aria-label="הגדרות">⚙︎</button>
      </div>
    </div>
    <div class="hero"><b id="sNights">–</b><span>מתוך <span id="sTarget">21</span> לילות</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stats">
      <div class="stat-row hdr"><span>🏨 <b id="sCount">–</b> מלונות נספרים</span><span id="sExcl" hidden></span></div>
      <div class="money-rows">
        <div class="mrow main"><span class="ml" id="sTotLbl">מחיר שנסגר</span><b id="sTotal">–</b><span class="mn"><b id="sAvg">–</b> ללילה</span></div>
        <div class="mrow" id="sBaseRow" hidden><span class="ml">בלי תוספות</span><b id="sBase">–</b><span class="mn"><b id="sAvgX">–</b> ללילה</span></div>
      </div>
    </div>
    <div class="grand" id="grandRow" hidden><span class="g-label">💰 סה״כ הוצאות הטיול</span><b id="sGrand">–</b><span class="g-sub" id="sGrandSub"></span></div>
    <div class="paid-line" id="paidLine" hidden></div>
    <div class="alert-line" id="alertLine" hidden></div>
  </header>
  <div class="tabbar">
    <div class="tabs">
      <button type="button" class="on" data-view="list">מלונות</button>
      <button type="button" data-view="budget">הוצאות</button>
      <button type="button" data-view="archive">ארכיון</button>
      <button type="button" data-view="history">היסטוריה</button>
    </div>
  </div>

  <section id="viewList">
    <div class="tools">
      <div class="search">🔎<input id="q" type="search" placeholder="חיפוש מלון / יעד / מספר הזמנה" autocomplete="off"><button id="qClear" class="clear" type="button" aria-label="ניקוי חיפוש" hidden>✕</button></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="viewBudget" hidden>
    <div id="budget"></div>
  </section>

  <section id="viewArchive" hidden>
    <div class="hist" id="arch"></div>
  </section>

  <section id="viewHistory" hidden>
    <div class="hist" id="hist"></div>
  </section>

  <div id="setupBox" class="setup" hidden>
    <h3>הגדרה ראשונית</h3>
    <p class="hint">חסר הטוקן. פתח את ⚙ הגדרות והדבק אותו (או פתח את הקישור שקיבלת עם ?token=).</p>
    <button class="btn primary full" id="btnSetup">פתח הגדרות</button>
  </div>
</div>

<datalist id="accounts"></datalist>
<button class="fab" id="fab" title="הוספת הזמנה">+</button>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="sheet-top"><div class="handle"></div><button class="sheet-close" id="sheetClose" type="button" aria-label="סגירה">✕</button></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div id="printView" hidden></div>

<script>
/* ====== הגדרות ====== */
// אחרי הפריסה של ה-Apps Script אפשר להדביק כאן את ה-URL קבוע, או להזין דרך מסך ההגדרות (נשמר במכשיר).
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxcQh48Ms3EZykmRmQo3rHk3ri96Fr61QR5TqxWOeDDwpySQzjM_-SCns8mmMRoqZxFYA/exec';
const SHEET_URL = ''; // אופציונלי: קישור לגיליון להצגה בהגדרות
const LS = { api:'tb_api', token:'tb_token', cache:'tb_cache', target:'tb_target', budget:'tb_budget', account:'tb_account' };
const EXP_CATS = [['טיסה','✈️'],['מזומן','🏧'],['תחבורה','🚕'],['אטרקציות','🎟️'],['ביטוח','🛡️'],['אחר','🧾']];
const catIcon = c => (EXP_CATS.find(x=>x[0]===c)||['','🧾'])[1];
const get = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const set = (k,v) => { try { localStorage.setItem(k, v); } catch {} };
const API = () => get(LS.api) || DEFAULT_API_URL;
const TOKEN = () => get(LS.token);

const PLATFORM_COLORS = { 'Booking':'#003580','Agoda':'#c62828','Expedia':'#c99a06','Hotels.com':'#b71c1c','Trip.com':'#287dfa','Airbnb':'#ff5a5f','ישירות מול המלון':'#0f766e','אחר':'#64748b' };
const CURRENCIES = ['ILS','USD','EUR','THB','GBP','JPY','VND','IDR','MYR','SGD','AED','TRY','CHF','AUD','INR','LKR','PHP','KRW','CNY','TWD','HKD','MXN','BRL','ZAR','CZK','HUF','PLN','SEK','NOK','DKK'];
const SYM = { ILS:'₪', USD:'$', EUR:'€', THB:'฿', GBP:'£', JPY:'¥' };
const USERS = ['צחי','שירן']; // יוזרים קבועים לבחירה מהירה (אפשר להקליד גם אחר)
const MISC = [['breakfast','☕ עם ארוחת בוקר'],['cancelOpen','🟢 ביטול חינם פתוח'],['cancelSoon','⏳ ביטול נגמר בקרוב'],['noCancel','🔒 בלי ביטול'],['unpaid','💳 לא שולם'],['paySoon','💳 חיוב ב-14 יום הקרובים'],['toCancel','❌ לבטל עד…']];
const MISC_LABEL = Object.fromEntries(MISC);
const QUICK = ['cancelSoon','unpaid']; // מתגים מהירים שתמיד מוצגים בשורת הצ'יפים
const SORTS = [['checkIn','תאריך הגעה'],['cancel','מועד ביטול'],['priceDesc','מחיר (יורד)'],['priceAsc','מחיר (עולה)'],['hotel','שם מלון']];

let state = { bookings:[], summary:null, reminders:null, expenses:[], budget:null, history:[], archive:[], altView:{}, filters:{ platform:'', dest:'', user:'', misc:new Set() }, q:'', sort:'checkIn', view:'list' };

/* ====== עזרים ====== */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v!==false&&v!=null) e.setAttribute(k,v); } for (const k of kids.flat()) if (k!=null) e.append(k.nodeType?k:document.createTextNode(k)); return e; };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysUntil = iso => { if(!iso) return null; const a=new Date(todayISO()+'T00:00:00'), b=new Date(iso+'T00:00:00'); return Math.round((b-a)/86400000); };
const WD = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const fmtD = (iso, withYear=false) => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}${withYear?'.'+String(d.getFullYear()).slice(2):''}`; };
const distinctNights = arr => { const iv=arr.filter(b=>b.checkIn&&b.checkOut&&b.checkIn<b.checkOut).map(b=>[b.checkIn,b.checkOut]).sort(); let t=0,cur=null; for(const x of iv){ if(!cur||x[0]>=cur[1]){ if(cur) t+=Math.round((new Date(cur[1])-new Date(cur[0]))/864e5); cur=[x[0],x[1]]; } else if(x[1]>cur[1]) cur[1]=x[1]; } if(cur) t+=Math.round((new Date(cur[1])-new Date(cur[0]))/864e5); return t; };
// שולם / נשאר לשלם: מלונות ששולמו + כל ההוצאות = שולם; מלונות שלא שולמו + תוספות במלון = נשאר
const norm = x => String(x||'').toLowerCase().replace(/[^a-z0-9\u0590-\u05ff]+/g,' ').trim();
const toCancel = b => !!(b.altInfo && b.altInfo.toCancel);
// תווית "לבטל עד" עם תאריך הביטול החינמי
const cancelBy = (b, withYear=true) => b.freeCancelUntil ? `לבטל עד ${fmtD(b.freeCancelUntil, withYear)}` : 'לבטל (אין ביטול חינם)';
async function cancelBooking(b) { if(!confirm('לסמן את "'+b.hotel+'" ('+b.platform+') כהזמנה שביטלת? היא תעבור לארכיון.')) return; try{ await api('cancel',{id:b.id},'POST'); toast('✓ סומן כבוטל, עבר לארכיון'); closeSheet(); await load(true);}catch(e){toast(e.message,true);} }
const isExcluded = b => !!b.backup || !!(b.altInfo && !b.altInfo.primary);
const paidSplit = () => { let paid=0, left=0; state.bookings.forEach(b=>{ if (isExcluded(b)) return; const v=Number(b.priceIls)||0; if (b.paid) paid+=v; else left+=v; left+=Number(b.extraIls)||0; }); (state.expenses||[]).forEach(e=>{ const v=Number(e.priceIls)||0; if (e.paid===false) left+=v; else paid+=v; }); return {paid, left}; };
const fmtN = n => (n===''||n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('he-IL', {maximumFractionDigits:0});
const money = (n,cur) => (n===''||n==null) ? '—' : `${fmtN(n)} ${SYM[cur]||cur||''}`;
const pc = p => PLATFORM_COLORS[p] || '#64748b';
let toastT; const toast = (m, err=false) => { const t=$('#toast'); t.textContent=m; t.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast', err?4000:2200); };
const loading = on => $('#loading').classList.toggle('on', !!on);
const toggleMisc = k => { state.filters.misc.has(k) ? state.filters.misc.delete(k) : state.filters.misc.add(k); };
const activeFilterCount = () => (state.filters.platform?1:0)+(state.filters.user?1:0)+(state.filters.dest?1:0)+state.filters.misc.size;

/* ====== API ====== */
async function api(action, params={}, method='GET') {
  if (!API() || !TOKEN()) { $('#setupBox').hidden=false; throw new Error('חסר URL או טוקן — פתח הגדרות'); }
  loading(true);
  try {
    let res;
    if (method==='GET') {
      const u = new URL(API()); u.searchParams.set('action', action); u.searchParams.set('token', TOKEN()); for (const [k,v] of Object.entries(params)) u.searchParams.set(k, v);
      res = await fetch(u, { redirect:'follow' });
    } else {
      res = await fetch(API(), { method:'POST', redirect:'follow', body: JSON.stringify({ action, token:TOKEN(), by:'web', ...params }) });
    }
    const data = await res.json();
    if (!data.ok) { const e=new Error(data.error||'שגיאה'); e.data=data; throw e; }
    return data;
  } finally { loading(false); }
}

async function load(silent=false) {
  try {
    const cached = get(LS.cache); if (cached && !state.bookings.length) { try { const c=JSON.parse(cached); state.bookings=c.bookings; state.summary=c.summary; state.reminders=c.reminders||null; state.expenses=c.expenses||[]; state.budget=c.budget||null; render(); } catch{} }
    const d = await api('list');
    state.bookings = d.bookings; state.summary = d.summary; state.reminders = d.reminders || null; state.expenses = d.expenses || []; state.budget = d.budget || null; set(LS.cache, JSON.stringify({bookings:d.bookings, summary:d.summary, reminders:d.reminders, expenses:d.expenses, budget:d.budget}));
    if (state.view==='budget') renderBudget();
    $('#setupBox').hidden = true;
    render();
    if (!silent) toast('עודכן ✓');
  } catch (e) { toast(e.message, true); render(); }
}
async function loadArchive() {
  try { const d = await api('archive'); state.archive = d.archive; renderArchive(); } catch (e) { toast(e.message, true); }
}
async function loadHistory() {
  try { const d = await api('history'); state.history = d.history; renderHistory(); } catch (e) { toast(e.message, true); }
}

/* ====== רינדור ====== */
function cancelInfo(b) {
  if (!b.freeCancelUntil) return { cls:'', txt:'🔒 בלי ביטול חינם', kind:'none' };
  const d = daysUntil(b.freeCancelUntil);
  if (d < 0) return { cls:'bad', txt:`🔒 ביטול נגמר ${fmtD(b.freeCancelUntil,true)}`, kind:'past' };
  if (d === 0) return { cls:'bad', txt:'🔴 ביטול חינם נגמר היום!', kind:'soon' };
  if (d <= 14) return { cls:'warn', txt:`⏳ ביטול חינם עוד ${d} ימים (${fmtD(b.freeCancelUntil,true)})`, kind:'soon' };
  return { cls:'ok', txt:`🟢 ביטול חינם עד ${fmtD(b.freeCancelUntil,true)}`, kind:'open' };
}

function filtered() {
  const f = state.filters, q = state.q.trim().toLowerCase();
  let arr = state.bookings.filter(b => {
    if (f.platform && b.platform !== f.platform) return false;
    if (f.dest && b.destination !== f.dest) return false;
    if (f.user && b.account !== f.user) return false;
    if (f.misc.has('breakfast') && !b.breakfast) return false;
    const ci = cancelInfo(b).kind;
    if (f.misc.has('cancelOpen') && !(ci==='open'||ci==='soon')) return false;
    if (f.misc.has('cancelSoon') && ci!=='soon') return false;
    if (f.misc.has('noCancel') && !(ci==='none'||ci==='past')) return false;
    if (f.misc.has('unpaid') && b.paid) return false;
    if (f.misc.has('toCancel') && !toCancel(b)) return false;
    if (f.misc.has('paySoon') && !(b.paymentDate && !b.paid && daysUntil(b.paymentDate)>=0 && daysUntil(b.paymentDate)<=14)) return false;
    if (q && ![b.hotel,b.destination,b.confirmation,b.platform,b.account,b.roomType,b.notes].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  const s = state.sort;
  arr.sort((a,b) => {
    if (s==='checkIn') return (a.checkIn||'9').localeCompare(b.checkIn||'9');
    if (s==='cancel') return (a.freeCancelUntil||'9999').localeCompare(b.freeCancelUntil||'9999');
    if (s==='priceDesc') return (Number(b.priceIls)||0)-(Number(a.priceIls)||0);
    if (s==='priceAsc') return (Number(a.priceIls)||0)-(Number(b.priceIls)||0);
    return (a.hotel||'').localeCompare(b.hotel||'');
  });
  return arr;
}

function render() {
  const S = state.summary || { nights:0, totalIls:0, count:state.bookings.length, targetNights: Number(get(LS.target)||21) };
  const target = S.targetNights || 21;
  $('#sNights').textContent = S.nights;
  $('#sTarget').textContent = target;
  // סכום המלונות: שורה ראשית = סופי כולל תוספות במלון; שורה שנייה = המחיר שנסגר בלי תוספות (רק כשיש תוספות)
  const BASE = Number(S.totalIls)||0, HX = Number(S.hotelsIls)||BASE, hasX = HX > BASE, NN = Number(S.nights)||0;
  $('#sTotLbl').textContent = hasX ? 'סופי כולל תוספות' : 'מחיר שנסגר';
  $('#sTotal').textContent = fmtN(HX) + ' ₪';
  $('#sAvg').textContent = NN ? fmtN(HX/NN) + ' ₪' : '–';

function buildPrint(o) {
  const all = [...state.bookings].sort((a,b)=>(a.checkIn||'9').localeCompare(b.checkIn||'9'));
  const rows = o.dups ? all : all.filter(b=>!isExcluded(b));
  const counted = rows.filter(b=>!isExcluded(b));
  const nights = distinctNights(counted);
  const base = counted.reduce((n,b)=>n+(Number(b.priceIls)||0),0);
  const extras = counted.reduce((n,b)=>n+(Number(b.extraIls)||0),0);
  const total = base + (o.extras?extras:0);
  const first = counted[0], last = counted[counted.length-1];
  const D = new Date(); const today = `${D.getDate()}.${D.getMonth()+1}.${D.getFullYear()}`;
  const v = document.querySelector('#printView'); v.innerHTML='';
  v.append(el('div',{class:'p-head'}, el('div',{}, el('h1',{},'הצעת מלונות · הטיול'), el('div',{class:'p-sub'}, (first?`${fmtD(first.checkIn,true)} עד ${fmtD(last.checkOut,true)} · `:'')+`${counted.length} מלונות · ${nights} לילות`)), el('div',{class:'p-sub'}, 'הופק '+today)));

    el('div',{}, el('b',{}, fmtN(total)+' ₪'), 'סה״כ מלונות'+(o.extras&&extras?' כולל תוספות':'')),
    (o.extras&&extras) ? el('div',{}, el('b',{}, fmtN(base)+' ₪'), 'בלי תוספות') : null,
    el('div',{}, el('b',{}, nights?fmtN(total/nights)+' ₪':'—'), 'ממוצע ללילה'+(o.extras&&extras?' כולל תוספות':'')),
    el('div',{}, el('b',{}, String(nights)), 'לילות')));
  const th = ['#','מלון','יעד','תאריכים','לילות','חדר','א. בוקר','דרך'];
  if (o.prices) { th.push('מחיר סופי במטבע המקומי'); if (o.extras) th.push('תוספת במלון'); th.push('סה״כ ₪', 'ללילה ₪'); if (o.extras) th.push('ללילה כולל תוספת'); }
  if (o.cancel) th.push('ביטול חינם עד');
  if (o.cancel) th.push('מועד תשלום');
  if (o.confirm) th.push('מספר הזמנה');
  if (o.users) th.push('יוזר');
  const KEY = ['מחיר סופי במטבע המקומי','ללילה כולל תוספת','ביטול חינם עד','מועד תשלום'];
  const tbl = el('table',{}, el('thead',{}, el('tr',{}, ...th.map(h=>el('th',{class:KEY.includes(h)?'k':''},h)))));
  const tb = el('tbody',{});

  const T = (t,cls='') => el('td',{class:cls}, t);
  rows.forEach((b,i)=>{
    const ex = isExcluded(b);
    const ils = Number(b.priceIls)||0, exIls = Number(b.extraIls)||0, n = Number(b.nights)||0;
    const cells = [T(String(i+1)), T(b.hotel||'','hotel'), T(b.destination||''), T(`${fmtD(b.checkIn,true)} – ${fmtD(b.checkOut,true)}`,''), T(String(n||'')), T(b.roomType||'—'), T(b.breakfast?'כלול':'לא כלול'), T(b.platform||'')];
    if (o.prices) {

    }
    if (o.cancel) cells.push(B(b.freeCancelUntil?fmtD(b.freeCancelUntil,true):'ללא ביטול', b.freeCancelUntil?'':'warn'));
    if (o.cancel) cells.push(B(b.paid?'שולם':(b.paymentDate?fmtD(b.paymentDate,true):'במלון')));

  });

  const form = el('form',{onsubmit: async ev => {
    ev.preventDefault();
    const fd = new FormData(form); const booking = Object.fromEntries(fd.entries());
    booking.breakfast = breakfast; booking.paid = paid; booking.backup = backup; booking.parallel = parallel;
    if (!booking.hotel.trim()) return toast('חסר שם מלון', true);
    if (booking.checkIn && booking.checkOut && booking.checkOut <= booking.checkIn) return toast('צ׳ק-אאוט חייב להיות אחרי צ׳ק-אין', true);
    const btn = form.querySelector('button[type=submit]'); btn.disabled=true;
    try {
      if (isEdit) { await api('update',{id:b.id, booking},'POST'); toast('עודכן ✓'); }
      else if (replacing) { await api('add',{booking, replaceId:replacing.id, note:'הזמנה מחדש'},'POST'); toast('הוחלף. הישנה בארכיון ✓'); }
      else { await api('add',{booking},'POST'); toast('נוסף ✓'); }
      if (booking.account) set(LS.account, booking.account);
      closeSheet(); await load(true);
    } catch(e) { toast(e.message,true); } finally { btn.disabled=false; }
  }},
    el('h2',{}, isEdit?'עריכת הזמנה':replacing?'הזמנה מחדש':'הזמנה חדשה'),
    replacing ? el('div',{class:'replace-note'}, `🔁 ההזמנה הישנה (${replacing.platform} · ${money(replacing.price,replacing.currency)}) תעבור לארכיון.`) : null,
    el('div',{class:'fsec'}, 'פרטים'),
    f('שם המלון *','hotel','text',{full:true, attrs:{required:true, autofocus:!isEdit}}),
    el('div',{class:'row'}, f('יעד (עיר / אי)','destination'), el('div',{class:'f'}, el('label',{},'פלטפורמה'), platSel)),
    el('div',{class:'row'}, f('צ׳ק-אין','checkIn','date'), f('צ׳ק-אאוט','checkOut','date')),
    el('div',{class:'row'}, f('סוג החדר','roomType'), f('מספר הזמנה','confirmation')),
    el('div',{class:'row'}, f('יוזר (צחי / שירן)','account','text',{attrs:{value:b.account??get(LS.account), list:'accounts', placeholder:'צחי'}}), f('קישור להזמנה','link','url')),
    sw('☕ כולל ארוחת בוקר', ()=>breakfast, v=>breakfast=v),
    el('div',{class:'fsec'}, 'מחיר'),
    el('div',{class:'row'}, f('מחיר ששולם','price','number',{attrs:{step:'0.01',inputmode:'decimal'}}), el('div',{class:'f'}, el('label',{},'מטבע'), curSel)),
    f('בשקלים (ריק = חישוב אוטומטי)','priceIls','number',{full:true, attrs:{step:'1',inputmode:'numeric'}}),
    el('div',{class:'row'}, f('תוספת שתשולם במלון (באותו מטבע)','extraPrice','number',{attrs:{step:'0.01',inputmode:'decimal',placeholder:'למשל מיטה נוספת'}}), f('על מה התוספת','extraNote','text',{attrs:{placeholder:'מיטה נוספת / ילד'}})),
    el('div',{class:'fsec'}, 'תשלום'),
    sw('💳 שולם מראש', ()=>paid, v=>paid=v),
    el('div',{class:'row'}, f('מועד חיוב (מתי יורד התשלום)','paymentDate','date'), f('ביטול חינם עד','freeCancelUntil','date')),
    el('div',{class:'fsec'}, 'סטטוס'),
    sw('🔁 חלופה / גיבוי (לא נספר בסכומים ובלילות)', ()=>backup, v=>backup=v),
    sw('🛏 חדר נוסף באותו מלון (לספור בנוסף, לא חלופה)', ()=>parallel, v=>parallel=v),
    el('div',{class:'f full'}, el('label',{},'הערות'), el('textarea',{name:'notes'}, b.notes||'')),
    el('div',{class:'actions'}, el('button',{type:'button',class:'btn ghost', onclick:closeSheet},'ביטול'), el('button',{type:'submit',class:'btn primary'}, isEdit?'שמירה':'הוספה'))
  );
  form.querySelector('[name=link]').value = b.link||'';
  const dl=$('#accounts'); dl.innerHTML=''; [...new Set([...USERS, ...state.bookings.map(x=>x.account).filter(Boolean)])].forEach(u=>dl.append(el('option',{value:u})));
  if (!isEdit && !b.account) form.querySelector('[name=account]').value = get(LS.account);
  // חישוב לילות חי
  const nightsHint = el('div',{class:'hint'}); form.querySelector('[name=checkOut]').parentElement.append(nightsHint);
  const upd = () => { const a=form.checkIn.value,c=form.checkOut.value; const n=a&&c?Math.round((new Date(c)-new Date(a))/864e5):0; nightsHint.textContent = n>0?`${n} לילות`:''; };
  form.checkIn.oninput = form.checkOut.oninput = upd; upd();
  openSheet(form);
}

function openSettings() {
  const inp = (l,k,ph,type='text') => el('div',{class:'f'}, el('label',{},l), el('input',{type, id:'st_'+k, value:get(k), placeholder:ph, autocomplete:'off'}));
  const box = el('div',{},
    el('h2',{},'הגדרות'),
    inp('כתובת ה-Web App (Apps Script)', LS.api, 'https://script.google.com/macros/s/…/exec','url'),
    inp('טוקן API', LS.token, 'מ-setup() בגיליון','password'),
    inp('יעד לילות לטיול', LS.target, '21','number'),
    inp('תקציב יעד (₪) — לא חובה, רק אם רוצים פס התקדמות', LS.budget, 'אפשר להשאיר ריק','number'),
    el('div',{class:'f'}, el('label',{},'🔔 תזכורות טלגרם לפני סיום ביטול חינם'), el('div',{class:'hint', style:'background:#f8fafc;border-radius:12px;padding:10px 12px;line-height:1.5'},
      (state.reminders&&state.reminders.active) ? `פעילות ✓ נשלחות ${state.reminders.days.join('/')} ימים לפני, בשעה 09:00.` :
      'לא מוגדרות. בעורך Apps Script של הגיליון: ⚙ הגדרות הפרויקט → Script properties → להוסיף TELEGRAM_BOT_TOKEN ו-TELEGRAM_CHAT_ID (431692318), ואז להריץ installTriggers() ו-sendTestReminder(). ברירת מחדל: 14, 7, 3, 1, 0 ימים לפני (REMINDER_DAYS).')),
    el('div',{class:'hint'}, 'הנתונים נשמרים במכשיר הזה בלבד.', SHEET_URL ? el('a',{href:SHEET_URL,target:'_blank',style:'margin-inline-start:6px'},'פתח את הגיליון ↗') : null),
    el('button',{type:'button', class:'textbtn', onclick:()=>{ closeSheet(); load(); if (state.view==='history') loadHistory(); if (state.view==='archive') loadArchive(); }}, '⟳ רענון'),
    el('div',{class:'actions'},
      el('button',{class:'btn', onclick:async()=>{ save(); try{ const u=new URL(API()); u.searchParams.set('action','ping'); const r=await (await fetch(u)).json(); if(r.ok){ await api('list'); toast('החיבור תקין ✓'); } else toast('אין תגובה תקינה',true);}catch(e){toast('נכשל: '+e.message,true);} }}, '🔌 בדיקת חיבור'),
      el('button',{class:'btn primary', onclick:async()=>{ save(); closeSheet(); const t=Number(get(LS.target)||21); try{ await api('setTarget',{nights:t},'POST'); await api('setBudget',{ils:Number(get(LS.budget)||0)},'POST'); }catch{} await load(); }}, 'שמירה'))
  );
  const save = () => { set(LS.api, $('#st_'+LS.api).value.trim()); set(LS.token, $('#st_'+LS.token).value.trim()); set(LS.target, $('#st_'+LS.target).value.trim()||'21'); set(LS.budget, $('#st_'+LS.budget).value.trim()||''); };
  openSheet(box);
}

/* ====== אירועים ====== */
$('#fab').onclick = () => state.view==='budget' ? openExpenseForm() : openForm();
$('#btnSettings').onclick = openSettings; $('#btnSetup').onclick = openSettings; $('#btnPrint').onclick = openPrint;
$('#q').oninput = e => { state.q = e.target.value; $('#qClear').hidden = !state.q; render(); };
$('#qClear').onclick = () => { $('#q').value=''; state.q=''; $('#qClear').hidden = true; render(); };
document.querySelectorAll('.tabs button').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===t));
  state.view = t.dataset.view; $('#viewList').hidden = state.view!=='list'; $('#viewBudget').hidden = state.view!=='budget'; $('#viewArchive').hidden = state.view!=='archive'; $('#viewHistory').hidden = state.view!=='history'; $('#fab').hidden = !(state.view==='list'||state.view==='budget');
  if (state.view==='budget') renderBudget();
  if (state.view==='history') loadHistory();
  if (state.view==='archive') loadArchive();
});
// גרירת ה-sheet למטה סוגרת
let sy=null; $('#sheet').addEventListener('touchstart',e=>{ if($('#sheet').scrollTop===0) sy=e.touches[0].clientY; },{passive:true});
$('#sheet').addEventListener('touchend',e=>{ if(sy!==null && e.changedTouches[0].clientY-sy>90) closeSheet(); sy=null; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && API() && TOKEN()) load(true); });

// קישור חד-פעמי: ?token=... נשמר במכשיר ונמחק מהכתובת
try { const qp = new URLSearchParams(location.search); if (qp.get('token')) { set(LS.token, qp.get('token').trim()); if (qp.get('api')) set(LS.api, qp.get('api')); history.replaceState(null, '', location.pathname); } } catch {}
if (!API() || !TOKEN()) { $('#setupBox').hidden=false; render(); } else load(true);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
